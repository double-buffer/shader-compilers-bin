name: Build-DXC

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      architecture:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{
      (inputs.platform == 'macos' && 'macos-14') ||
      (inputs.platform == 'linux' && 'ubuntu-latest') ||
      (inputs.platform == 'windows' && 'windows-latest')
      }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get DXC version
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        echo "CURRENT_TAG=$(git describe --tags)" >> $GITHUB_ENV
        echo "CURRENT_TAG_ARTIFACT=$(git describe --tags | sed 's/\./_/g')" >> $GITHUB_ENV

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6

    - name: Setup MSVC
      if: inputs.platform == 'windows'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ inputs.architecture }}

    - name: Configure DXC (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        cmake -S . -B build -G Ninja \
          -C ./cmake/caches/PredefinedParams.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DHLSL_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DSPIRV_BUILD_TESTS=OFF

    - name: Configure DXC (macOS)
      if: inputs.platform == 'macos'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        cmake -S . -B build -G Ninja \
          -C ./cmake/caches/PredefinedParams.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_OSX_ARCHITECTURES=${{ inputs.architecture == 'x64' && 'x86_64' || inputs.architecture }} \
          -DHLSL_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DSPIRV_BUILD_TESTS=OFF

    - name: Configure DXC (Windows)
      if: inputs.platform == 'windows'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        cmake -S . -B build -G Ninja \
          -C ./cmake/caches/PredefinedParams.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DHLSL_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DSPIRV_BUILD_TESTS=OFF

    - name: Build DXC
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: cmake --build build --config Release --parallel

    - name: Prepare package
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        mkdir -p ./publish/bin ./publish/lib ./publish/include/dxc
        cp ./include/dxc/WinAdapter.h ./publish/include/dxc/
        cp ./include/dxc/dxcisense.h ./publish/include/dxc/
        cp ./include/dxc/dxcerrors.h ./publish/include/dxc/
        cp ./include/dxc/dxcapi.h ./publish/include/dxc/
        cp ./LICENSE.TXT ./publish/

    - name: Copy executable (Unix)
      if: inputs.platform != 'windows'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: cp ./build/bin/dxc ./publish/bin/

    - name: Copy executable (Windows)
      if: inputs.platform == 'windows'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: cp ./build/bin/dxc.exe ./publish/bin/

    - name: Copy libraries (macOS)
      if: inputs.platform == 'macos'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        cp ./build/lib/libdxcompiler.dylib ./publish/lib/
        cp ./build/lib/libdxil.dylib ./publish/lib/

    - name: Copy libraries (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        cp ./build/lib/libdxcompiler.so ./publish/lib/
        cp ./build/lib/libdxil.so ./publish/lib/

    - name: Copy libraries (Windows)
      if: inputs.platform == 'windows'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler
      run: |
        cp ./build/bin/dxcompiler.dll ./publish/lib/
        cp ./build/bin/dxil.dll ./publish/lib/

    - name: Zip binaries (Unix)
      if: inputs.platform != 'windows'
      shell: bash
      working-directory: ./src/DirectXShaderCompiler/publish
      run: zip ./${{ inputs.platform }}_dxc_${{ env.CURRENT_TAG_ARTIFACT }}_${{ inputs.architecture }}.zip ./* -r

    - name: Zip binaries (Windows)
      if: inputs.platform == 'windows'
      working-directory: ./src/DirectXShaderCompiler/publish
      run: Compress-Archive -Path ./* -Destination ./${{ inputs.platform }}_dxc_${{ env.CURRENT_TAG_ARTIFACT }}_${{ inputs.architecture }}.zip

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.platform }}_dxc_${{ env.CURRENT_TAG_ARTIFACT }}_${{ inputs.architecture }}
        path: ./src/DirectXShaderCompiler/publish/*.zip
        compression-level: 0
