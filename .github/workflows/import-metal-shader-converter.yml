name: Import Metal Shader Converter

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Metal Shader Converter version; empty uses the version from the source draft inbox'
        required: false
        type: string
      target_release:
        description: 'Release tag that receives the normalized packages; empty uses the latest published release'
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      version: ${{ steps.prepare.outputs.version }}
      target_release: ${{ steps.prepare.outputs.target_release }}
      version_tag: ${{ steps.prepare.outputs.version_tag }}
      macos_asset: ${{ steps.prepare.outputs.macos_asset }}
      windows_asset: ${{ steps.prepare.outputs.windows_asset }}
    steps:
    - name: Prepare Import
      id: prepare
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_TAG: metal-shader-converter-source
        REQUESTED_VERSION: ${{ inputs.version }}
        REQUESTED_TARGET_RELEASE: ${{ inputs.target_release }}
      shell: bash
      run: |
        set -euo pipefail

        VERSION="$REQUESTED_VERSION"
        SOURCE_EXISTS=false

        if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          SOURCE_EXISTS=true

          if [[ -z "$VERSION" ]]; then
            SOURCE_NAME="$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json name --jq '.name')"
            if [[ "$SOURCE_NAME" =~ ^Metal[[:space:]]Shader[[:space:]]Converter[[:space:]](.+)[[:space:]]source[[:space:]]inbox$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              echo "Using Metal Shader Converter version from source inbox: $VERSION"
            else
              echo "::error::Version was not supplied and could not be inferred from the source draft title '$SOURCE_NAME'."
              exit 1
            fi
          fi
        fi

        if [[ -z "$VERSION" ]]; then
          echo "::error::No Metal Shader Converter source draft exists to infer a version from. Run Check Metal Shader Converter first, or supply a version once to create the inbox."
          exit 1
        fi

        VERSION_TAG="$(printf '%s' "$VERSION" | sed -E 's/[^A-Za-z0-9]+/_/g; s/^_+//; s/_+$//')"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

        TARGET_RELEASE="$REQUESTED_TARGET_RELEASE"
        if [[ -z "$TARGET_RELEASE" ]]; then
          TARGET_RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft == false and .prerelease == false and (.tag_name | startswith("metal-shader-converter-source") | not))) | sort_by(.published_at) | last | .tag_name')"
        fi

        if [[ -z "$TARGET_RELEASE" || "$TARGET_RELEASE" == "null" ]]; then
          echo "::error::Could not determine a published target release."
          exit 1
        fi

        if [[ "$TARGET_RELEASE" == "$SOURCE_TAG" ]]; then
          echo "::error::Refusing to use the temporary source inbox as the target release."
          exit 1
        fi

        echo "target_release=$TARGET_RELEASE" >> "$GITHUB_OUTPUT"

        if [[ "$SOURCE_EXISTS" != "true" ]]; then
          gh release create "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Metal Shader Converter $VERSION source inbox" \
            --notes "Temporary workflow inbox for Apple Metal Shader Converter $VERSION installers. Upload the macOS and Windows downloads here, then rerun Import Metal Shader Converter. The version can be left empty on the second run." \
            --draft

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Metal Shader Converter inbox created::Open the draft release '$SOURCE_TAG', upload the Apple macOS and Windows packages, then rerun this workflow. The version can be left empty."
          exit 0
        fi

        mapfile -t ASSETS < <(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

        if (( ${#ASSETS[@]} < 2 )); then
          echo "::error::Upload both the macOS and Windows Apple packages to the draft release '$SOURCE_TAG', then rerun this workflow."
          printf 'Available assets:\n'
          printf '  %s\n' "${ASSETS[@]:-<none>}"
          exit 1
        fi

        MACOS_ASSET=''
        WINDOWS_ASSET=''

        for asset in "${ASSETS[@]}"; do
          lower="$(printf '%s' "$asset" | tr '[:upper:]' '[:lower:]')"

          case "$lower" in
            *.dmg|*.pkg)
              [[ -z "$MACOS_ASSET" ]] && MACOS_ASSET="$asset"
              ;;
            *.exe|*.msi)
              [[ -z "$WINDOWS_ASSET" ]] && WINDOWS_ASSET="$asset"
              ;;
          esac

          if [[ -z "$MACOS_ASSET" && "$lower" =~ (macos|mac_os|mac|osx) ]]; then
            MACOS_ASSET="$asset"
          fi

          if [[ -z "$WINDOWS_ASSET" && "$lower" =~ (windows|win64|win32|win) ]]; then
            WINDOWS_ASSET="$asset"
          fi
        done

        if [[ -n "$MACOS_ASSET" && -z "$WINDOWS_ASSET" ]]; then
          for asset in "${ASSETS[@]}"; do
            [[ "$asset" != "$MACOS_ASSET" ]] && WINDOWS_ASSET="$asset" && break
          done
        elif [[ -n "$WINDOWS_ASSET" && -z "$MACOS_ASSET" ]]; then
          for asset in "${ASSETS[@]}"; do
            [[ "$asset" != "$WINDOWS_ASSET" ]] && MACOS_ASSET="$asset" && break
          done
        fi

        if [[ -z "$MACOS_ASSET" || -z "$WINDOWS_ASSET" || "$MACOS_ASSET" == "$WINDOWS_ASSET" ]]; then
          echo "::error::Could not identify the macOS and Windows packages automatically. Keep only the two Apple packages in '$SOURCE_TAG' and make sure their filenames or extensions identify the platform."
          printf 'Available assets:\n'
          printf '  %s\n' "${ASSETS[@]}"
          exit 1
        fi

        echo "macos_asset=$MACOS_ASSET" >> "$GITHUB_OUTPUT"
        echo "windows_asset=$WINDOWS_ASSET" >> "$GITHUB_OUTPUT"
        echo "ready=true" >> "$GITHUB_OUTPUT"

        echo "Metal Shader Converter version: $VERSION"
        echo "macOS package: $MACOS_ASSET"
        echo "Windows package: $WINDOWS_ASSET"
        echo "Target release: $TARGET_RELEASE"

  package-macos:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: macos-latest
    steps:
    - name: Download Apple Package
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_TAG: metal-shader-converter-source
        SOURCE_ASSET: ${{ needs.prepare.outputs.macos_asset }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p source
        gh release download "$SOURCE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "$SOURCE_ASSET" \
          --dir source

    - name: Extract Apple Package
      env:
        SOURCE_ASSET: ${{ needs.prepare.outputs.macos_asset }}
      shell: bash
      run: |
        set -euo pipefail

        SOURCE_FILE="$PWD/source/$SOURCE_ASSET"
        mkdir -p work/raw work/expanded

        case "$SOURCE_FILE" in
          *.zip|*.ZIP)
            ditto -x -k "$SOURCE_FILE" work/raw
            ;;
          *.pkg|*.PKG)
            pkgutil --expand-full "$SOURCE_FILE" work/expanded/source-package
            ;;
          *.dmg|*.DMG)
            mkdir -p work/mount
            hdiutil attach "$SOURCE_FILE" -readonly -nobrowse -mountpoint "$PWD/work/mount"
            cp -R work/mount/. work/raw/
            hdiutil detach "$PWD/work/mount"
            ;;
          *)
            cp "$SOURCE_FILE" work/raw/
            ;;
        esac

        index=0
        while IFS= read -r -d '' package; do
          index=$((index + 1))
          pkgutil --expand-full "$package" "work/expanded/package-$index"
        done < <(find work/raw -type f \( -name '*.pkg' -o -name '*.PKG' \) -print0)

    - name: Normalize macOS Package
      env:
        VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      shell: bash
      run: |
        set -euo pipefail

        LIBRARY=''
        while IFS= read -r -d '' candidate; do
          BUILD_INFO="$(xcrun vtool -show-build "$candidate" 2>/dev/null || true)"
          if grep -Eq 'platform[[:space:]]+(MACOS|1)([[:space:]]|$)' <<< "$BUILD_INFO"; then
            LIBRARY="$candidate"
            break
          fi
        done < <(find work -type f -name 'libmetalirconverter.dylib' -print0)

        HEADER="$(find work -type f -path '*/metal_irconverter/metal_irconverter.h' -print -quit)"

        if [[ -z "$LIBRARY" || -z "$HEADER" ]]; then
          echo "macOS Metal Shader Converter library/header not found after extracting the Apple package."
          echo "Metal Shader Converter dylib candidates:"
          while IFS= read -r -d '' candidate; do
            echo "--- $candidate"
            xcrun vtool -show-build "$candidate" 2>/dev/null || true
          done < <(find work -type f -name 'libmetalirconverter.dylib' -print0)
          exit 1
        fi

        echo "Selected macOS library: $LIBRARY"
        xcrun vtool -show-build "$LIBRARY"

        mkdir -p publish/include publish/lib
        cp "$LIBRARY" publish/lib/

        INCLUDE_ROOT="${HEADER%/metal_irconverter/metal_irconverter.h}"
        while IFS= read -r -d '' include_dir; do
          cp -R "$include_dir" publish/include/
        done < <(find "$INCLUDE_ROOT" -maxdepth 1 -type d -name 'metal_irconverter*' -print0)

        lipo -archs publish/lib/libmetalirconverter.dylib | tr ' ' '\n' | grep -Fxq arm64
        xcrun vtool -show-build publish/lib/libmetalirconverter.dylib | grep -Eq 'platform[[:space:]]+(MACOS|1)([[:space:]]|$)'

        PACKAGE="macos_MetalShaderConverter_${VERSION_TAG}_arm64.zip"
        (cd publish && zip -r "../$PACKAGE" include lib)
        echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

    - name: Upload macOS Package
      uses: actions/upload-artifact@v7
      with:
        name: metal-shader-converter-macos
        path: ${{ env.PACKAGE }}
        compression-level: 0

  package-windows:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
    - name: Download Apple Package
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_TAG: metal-shader-converter-source
        SOURCE_ASSET: ${{ needs.prepare.outputs.windows_asset }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force source | Out-Null
        gh release download $env:SOURCE_TAG `
          --repo $env:GITHUB_REPOSITORY `
          --pattern $env:SOURCE_ASSET `
          --dir source

    - name: Extract Apple Package
      env:
        SOURCE_ASSET: ${{ needs.prepare.outputs.windows_asset }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $sourceFile = Join-Path $PWD "source/$env:SOURCE_ASSET"
        $raw = Join-Path $PWD 'work/raw'
        New-Item -ItemType Directory -Force $raw | Out-Null

        $extension = [System.IO.Path]::GetExtension($sourceFile).ToLowerInvariant()

        if ($extension -eq '.zip') {
          Expand-Archive -Path $sourceFile -DestinationPath $raw -Force
        }
        elseif ($extension -eq '.msi') {
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$sourceFile`"", '/qn', "TARGETDIR=`"$raw`"")
          if ($process.ExitCode -ne 0) { throw "msiexec extraction failed with exit code $($process.ExitCode)" }
        }
        else {
          & 7z x $sourceFile "-o$raw" -y
          if ($LASTEXITCODE -ne 0) {
            throw '7-Zip could not extract the Apple Windows package. Re-upload it as a ZIP containing the installer contents and rerun the workflow.'
          }
        }

        $nestedMsi = Get-ChildItem $raw -Recurse -File -Filter '*.msi'
        $index = 0
        foreach ($msi in $nestedMsi) {
          $index++
          $destination = Join-Path $PWD "work/msi-$index"
          New-Item -ItemType Directory -Force $destination | Out-Null
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$destination`"")
          if ($process.ExitCode -ne 0) { throw "Nested MSI extraction failed with exit code $($process.ExitCode)" }
        }

    - name: Normalize Windows Package
      env:
        VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $library = Get-ChildItem work -Recurse -File -Filter 'metalirconverter.lib' | Select-Object -First 1
        $dll = Get-ChildItem work -Recurse -File -Filter 'metalirconverter.dll' | Select-Object -First 1
        $header = Get-ChildItem work -Recurse -File -Filter 'metal_irconverter.h' | Where-Object { $_.Directory.Name -eq 'metal_irconverter' } | Select-Object -First 1

        if (-not $library -or -not $dll -or -not $header) {
          Write-Host 'Metal Shader Converter library/header not found after extracting the Apple package.'
          Get-ChildItem work -Recurse -File | Where-Object { $_.Name -match 'metal.*irconverter' } | Select-Object -ExpandProperty FullName
          throw 'Unable to normalize Metal Shader Converter for Windows.'
        }

        New-Item -ItemType Directory -Force publish/include, publish/lib | Out-Null
        Copy-Item $library.FullName publish/lib/
        Copy-Item $dll.FullName publish/lib/

        $includeRoot = Split-Path (Split-Path $header.FullName -Parent) -Parent
        Get-ChildItem $includeRoot -Directory -Filter 'metal_irconverter*' | ForEach-Object {
          Copy-Item $_.FullName publish/include/ -Recurse
        }

        $package = "windows_MetalShaderConverter_$env:VERSION_TAG`_x64.zip"
        Compress-Archive -Path publish/* -DestinationPath $package -Force
        "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload Windows Package
      uses: actions/upload-artifact@v7
      with:
        name: metal-shader-converter-windows
        path: ${{ env.PACKAGE }}
        compression-level: 0

  publish:
    needs: [prepare, package-macos, package-windows]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Download Normalized Packages
      uses: actions/download-artifact@v8
      with:
        pattern: metal-shader-converter-*
        path: packages
        merge-multiple: true

    - name: Upload Packages and Clean Up
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_RELEASE: ${{ needs.prepare.outputs.target_release }}
        SOURCE_TAG: metal-shader-converter-source
        VERSION: ${{ needs.prepare.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail

        ls -lh packages

        if [[ "$TARGET_RELEASE" == "$SOURCE_TAG" ]]; then
          echo "::error::Refusing to upload normalized packages back into the temporary source inbox."
          exit 1
        fi

        mapfile -t PACKAGE_FILES < <(find packages -maxdepth 1 -type f -name '*.zip' -print)
        if (( ${#PACKAGE_FILES[@]} != 2 )); then
          echo "::error::Expected exactly two normalized Metal Shader Converter packages."
          printf '  %s\n' "${PACKAGE_FILES[@]:-<none>}"
          exit 1
        fi

        gh release upload "$TARGET_RELEASE" "${PACKAGE_FILES[@]}" \
          --repo "$GITHUB_REPOSITORY" \
          --clobber

        RELEASE_ASSETS="$(gh release view "$TARGET_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
        for package in "${PACKAGE_FILES[@]}"; do
          PACKAGE_NAME="$(basename "$package")"
          if ! grep -Fxq "$PACKAGE_NAME" <<< "$RELEASE_ASSETS"; then
            echo "::error::Package '$PACKAGE_NAME' is missing from target release '$TARGET_RELEASE' after upload. Source inbox will be preserved."
            exit 1
          fi
        done

        gh release delete "$SOURCE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --yes

        TITLE="Metal Shader Converter $VERSION available"
        ISSUE_NUMBER="$(gh issue list \
          --repo "$GITHUB_REPOSITORY" \
          --state open \
          --limit 100 \
          --json number,title | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .number' | head -n 1)"

        if [[ -n "$ISSUE_NUMBER" ]]; then
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Metal Shader Converter $VERSION was packaged successfully in $TARGET_RELEASE."
        fi

        echo "Metal Shader Converter packages uploaded and verified in $TARGET_RELEASE; source inbox deleted."
