name: Build DXC CI

on:
  pull_request:
    paths:
      - 'src/DirectXShaderCompiler'
      - 'src/DirectXShaderCompiler/**'
      - '.github/workflows/build-dxc.yml'
      - '.github/workflows/build-dxc-ci.yml'
  workflow_dispatch:

jobs:
  build-dxc:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.DXC_PLATFORMS) }}
    uses: ./.github/workflows/build-dxc.yml
    name: 'build-dxc-${{ matrix.platform }}-${{ matrix.architecture }}'
    with:
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
